name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate catalogue
        run: node -e "const c=require('./catalogue/ai-vendors.json');const ids=new Set();for(const v of c.vendors){if(!v.id||!v.name||!v.category||!Array.isArray(v.emailDomains))throw new Error('Bad entry: '+JSON.stringify(v));if(ids.has(v.id))throw new Error('Duplicate id: '+v.id);ids.add(v.id)}console.log(ids.size+' vendors OK')"

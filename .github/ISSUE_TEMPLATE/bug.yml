name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: dropdown
    id: connector
    attributes:
      label: Connector
      options: [Google Workspace, Microsoft 365, CSV import, Dashboard, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the error message shown. Please remove any email addresses, tenant IDs or secrets.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: input
    id: node
    attributes:
      label: Node.js version and how you run it (npm, Docker)
